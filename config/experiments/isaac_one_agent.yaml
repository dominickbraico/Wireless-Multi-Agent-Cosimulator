# Isaac Sim spike: one multirotor (a Pegasus Iris) in Isaac Sim with the pinned PX4 attached over the simulator MAVLink interface.
# Needs the NVIDIA Container Toolkit and COSIM_ACCEPT_ISAAC_EULA=Y (docs/CONTAINERS.md, "Isaac Sim"). Not a supported simulator yet.
experiment:
  name: isaac_one_agent
  duration_s: 60
  log_dir: logs/${name}_${timestamp}
time:
  ns3_sync_mode: BestEffort        # BestEffort | HardLimit
  ns3_hard_limit_s: 0.1
  max_lag_ms: 10                   # run flagged invalid above this
  min_rtf: 0.95
  rtf_window_s: 5.0                # sliding-mean window for the RTF validity check
network:
  backend: ns3                     # network emulator engine (only ns3 exists; a 'netem' stress backend would be another)
  technology: wifi                 # radio technology = which ns-3 scenario runs; see docs/CONTAINERS.md 'Changing the networking technology'
  wifi:
    standard: 80211a
    mac: adhoc
    rate_manager: ConstantRate
    data_mode: OfdmRate12Mbps
    control_mode: OfdmRate6Mbps
    tx_power_dbm: 16.0
    error_rate_model: TableBased   # TableBased (ns-3 default for Yans) | Nist
    retry_limit: null              # null = ns-3 default (7 attempts)
    phy:                           # receiver parameters; defaults are ns-3's, all hardware-measurable
      rx_noise_figure_db: 7.0
      preamble_detection_min_rssi_dbm: -82.0   # frames weaker than this are never detected (hard cutoff)
      preamble_detection_snr_db: 4.0           # ... or with SNR below this
      cca_ed_threshold_dbm: -62.0
      rx_sensitivity_dbm: -101.0
  channel:
    loss:
      - {type: LogDistance, exponent: 3.0, ref_distance_m: 1.0, ref_loss_db: 46.6777}
    delay: ConstantSpeed
  pose:
    transport: udp
    listen_addr: 127.0.0.1         # where the ns-3 pose listener binds (mgmt network in Docker)
    port: 5600
    rate_hz: 50
  radio_subnet: 10.10.0.0/24
  radio_firewall:                  # default-deny on radio0 inside each agent; absent = no firewall (link tests)
    enabled: false                 # the PX4 flight tests turn this on
    allow_udp_ports: [17900, 18149]   # RTPS ports of DDS domain 42 (7400 + 250*42 .. +249)
  mgmt:                            # unemulated management network: simulator <-> agents, never agent <-> agent
    bridge: br-mgmt
    subnet: 10.20.0.0/24
    bridge_ip: 10.20.0.1           # simulator side (Gazebo, pose bridge, ns-3) lives here
agents:
  - {name: agent1, vehicle: iris, radio_ip: 10.10.0.1, mgmt_ip: 10.20.0.11, px4_instance: 0, spawn_pose: [0, 0, 0.3, 0], tap: tap-a1, bridge: br-a1, initial_position: [0, 0, 0.1], antenna_offset: [0, 0, 0.1]}
simulator:
  type: isaac
  world_name: flat_plane           # procedural ground plane; no NVIDIA environment asset is loaded
