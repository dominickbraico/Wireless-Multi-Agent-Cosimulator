# Single source of truth for an experiment. Read by the ns-3 scenario, the
# orchestrator and (later) the pose bridge. A copy is saved in every run's log dir.
experiment:
  name: two_agent_wifi_snr_floor
  duration_s: 60
  log_dir: logs/${name}_${timestamp}
time:
  ns3_sync_mode: BestEffort        # BestEffort | HardLimit
  ns3_hard_limit_s: 0.1
  max_lag_ms: 10                   # run flagged invalid above this
  min_rtf: 0.95
  rtf_window_s: 5.0                # sliding-mean window for the RTF validity check
network:
  backend: ns3                     # interface kept open for a 'netem' stress backend
  wifi:
    standard: 80211a
    mac: adhoc
    rate_manager: ConstantRate
    data_mode: OfdmRate12Mbps
    control_mode: OfdmRate6Mbps
    tx_power_dbm: 16.0
    error_rate_model: TableBased   # TableBased (ns-3 default for Yans) | Nist
    retry_limit: null              # null = ns-3 default (7 attempts)
    phy:                           # receiver parameters; defaults are ns-3's, all hardware-measurable
      rx_noise_figure_db: 7.0
      preamble_detection_min_rssi_dbm: -101.0  # VARIANT: RSSI floor lowered so the SNR floor sets the range
      preamble_detection_snr_db: 4.0           # ... or with SNR below this
      cca_ed_threshold_dbm: -62.0
      rx_sensitivity_dbm: -101.0
  channel:
    loss:
      - {type: LogDistance, exponent: 3.0, ref_distance_m: 1.0, ref_loss_db: 46.6777}
    delay: ConstantSpeed
  pose:
    transport: udp
    listen_addr: 127.0.0.1         # where the ns-3 pose listener binds (mgmt network in Docker)
    port: 5600
    rate_hz: 50
  radio_subnet: 10.10.0.0/24
  radio_firewall:                  # default-deny on radio0 inside each agent; absent = no firewall (link tests)
    enabled: false                 # the PX4 flight tests turn this on
    allow_udp_ports: [17900, 18149]   # RTPS ports of DDS domain 42 (7400 + 250*42 .. +249)
  mgmt:                            # unemulated management network: simulator <-> agents, never agent <-> agent
    bridge: br-mgmt
    subnet: 10.20.0.0/24
    bridge_ip: 10.20.0.1           # simulator side (Gazebo, pose bridge, ns-3) lives here
agents:
  - {name: agent1, radio_ip: 10.10.0.1, mgmt_ip: 10.20.0.11, px4_instance: 0, px4_gz_model: x500_0, spawn_pose: [0, 0, 0.3, 0], tap: tap-a1, bridge: br-a1, initial_position: [0, 0, 0.1],  antenna_offset: [0, 0, 0.1]}
  - {name: agent2, radio_ip: 10.10.0.2, mgmt_ip: 10.20.0.12, px4_instance: 1, px4_gz_model: x500_1, spawn_pose: [0, 3, 0.3, 0], tap: tap-a2, bridge: br-a2, initial_position: [10, 0, 0.1], antenna_offset: [0, 0, 0.1]}
simulator:
  type: gazebo
  world: worlds/two_agent_flat.sdf
  world_name: two_agent_flat       # must equal the <world name> and the .sdf filename
  pose_topic: pose/info            # under /world/<world_name>/
  gz_partition: cosim
  px4_world_name: px4_flat         # world used by the PX4 stack (worlds/px4_flat.sdf)
